# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / CI
'on':
  workflow_dispatch:
    inputs:
      release:
        description: 'Stable-release candidate run: force every applicability lane and make the aggregate gate strict (skipped
          required lanes fail).'
        required: false
        type: boolean
        default: false
      strict_acceptance:
        description: 'Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing (''upd-txn'',
          a comma list, or ''1'' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release:
        description: 'Stable-release candidate run: force every applicability lane and make the aggregate gate strict (skipped
          required lanes fail).'
        required: false
        type: boolean
        default: false
  push:
    branches:
    - routef/independent-ci-01f8332c
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ inputs.release == true && github.run_id || (github.event_name == 'pull_request' && github.event.pull_request.number
    || github.ref) }}
  cancel-in-progress: ${{ inputs.release != true && github.event_name == 'pull_request' }}
jobs:
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      python: ${{ steps.gate-lanes.outputs.python }}
      python_prod: ${{ steps.gate-lanes.outputs.python_prod }}
      frontend: ${{ steps.gate-lanes.outputs.frontend }}
      site: ${{ steps.gate-lanes.outputs.site }}
      scan: ${{ steps.gate-lanes.outputs.scan }}
      deps: ${{ steps.gate-lanes.outputs.deps }}
      uv_lock: ${{ steps.gate-lanes.outputs.uv_lock }}
      npm_lock: ${{ steps.gate-lanes.outputs.npm_lock }}
      bootstrap: ${{ steps.gate-lanes.outputs.bootstrap }}
      desktop_updater: ${{ steps.gate-lanes.outputs.desktop_updater }}
      rust: ${{ steps.gate-lanes.outputs.rust }}
      docker_meta: ${{ steps.gate-lanes.outputs.docker_meta }}
      e2e: ${{ steps.gate-lanes.outputs.e2e }}
      e2e_upgrade: ${{ steps.gate-lanes.outputs.e2e_upgrade }}
      e2e_desktop_core: ${{ steps.gate-lanes.outputs.e2e_desktop_core }}
      e2e_desktop_update: ${{ steps.gate-lanes.outputs.e2e_desktop_update }}
      event_name: ${{ github.event_name }}
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Detect affected areas
      id: classify
      uses: ./.github/actions/detect-changes
      with:
        github-token: ${{ github.token }}
    - name: Force all lanes on release
      id: gate-lanes
      env:
        RELEASE: ${{ inputs.release }}
        CLASSIFIED: ${{ toJSON(steps.classify.outputs) }}
      run: "python3 - <<'PY'\nimport json, os\nvalues = json.loads(os.environ['CLASSIFIED'])\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a', encoding='utf-8') as output:\n    for lane, value in values.items():\n        if os.environ['RELEASE'] == 'true'\
        \ and value in ('true', 'false'):\n            value = 'true'\n        if '\\n' in value or '\\r' in value:\n    \
        \        continue\n        output.write(f'{lane}={value}\\n')\nPY\n"
  tests:
    name: Python tests
    needs: detect
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.e2e == 'true' || needs.detect.outputs.e2e_upgrade ==
      'true'
    uses: ./.github/workflows/routef-tests.yml
    with:
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}
  tests-os:
    name: OS-specific tests
    needs: detect
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.desktop_updater == 'true' || needs.detect.outputs.e2e
      == 'true' || needs.detect.outputs.e2e_upgrade == 'true'
    uses: ./.github/workflows/routef-tests-os.yml
    with:
      desktop_updater: ${{ needs.detect.outputs.desktop_updater == 'true' }}
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}
  lint:
    name: Python lints
    needs: detect
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/routef-lint.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      python: ${{ needs.detect.outputs.python == 'true' }}
  js-tests:
    name: JS & TS checks
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/routef-js-tests.yml
  rust-tests:
    name: Rust tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/routef-rust-tests.yml
  bootstrap-installer:
    name: Bootstrap installer
    needs: detect
    if: needs.detect.outputs.bootstrap == 'true'
    uses: ./.github/workflows/routef-bootstrap-installer.yml
  e2e-desktop:
    name: Desktop E2E
    needs: detect
    if: false
    uses: ./.github/workflows/routef-e2e-desktop.yml
  e2e-desktop-core:
    name: Desktop core E2E
    needs: detect
    if: needs.detect.outputs.e2e_desktop_core == 'true'
    uses: ./.github/workflows/routef-e2e-desktop-core.yml
  e2e-desktop-update:
    name: Desktop update E2E
    needs: detect
    if: needs.detect.outputs.e2e_desktop_update == 'true'
    uses: ./.github/workflows/routef-e2e-desktop-update.yml
  docs-site:
    name: Docs Site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    uses: ./.github/workflows/routef-docs-site-checks.yml
  history-check:
    name: Deny unrelated histories
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request'
    uses: ./.github/workflows/routef-history-check.yml
  contributor-check:
    name: Check contributors
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/routef-contributor-check.yml
  uv-lockfile:
    name: Check uv.lock
    needs: detect
    if: needs.detect.outputs.uv_lock == 'true'
    uses: ./.github/workflows/routef-uv-lockfile-check.yml
  infographic-check:
    name: Check no committed infographics
    needs: detect
    uses: ./.github/workflows/routef-infographic-check.yml
  profile-artifact-check:
    name: Profile artifact check
    needs: detect
    uses: ./.github/workflows/routef-profile-artifact-check.yml
  icons-freshness-check:
    name: Icon assets freshness
    needs: detect
    uses: ./.github/workflows/routef-icons-freshness-check.yml
  case-collision-check:
    name: Check no case-colliding filenames
    needs: detect
    uses: ./.github/workflows/routef-case-collision-check.yml
  lazy-deps-guard:
    name: No production imports of the tools.lazy_deps stub
    needs: detect
    uses: ./.github/workflows/routef-lazy-deps-guard.yml
  lockfile-diff:
    name: package-lock.json diff
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.npm_lock == 'true'
    uses: ./.github/workflows/routef-lockfile-diff.yml
  docker-lint:
    name: Lint Docker scripts
    needs: detect
    if: needs.detect.outputs.docker_meta == 'true'
    uses: ./.github/workflows/routef-docker-lint.yml
  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.scan == 'true' || needs.detect.outputs.deps
      == 'true')
    uses: ./.github/workflows/routef-supply-chain-audit.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}
  all-checks-pass:
    name: All required checks pass (v2)
    needs:
    - detect
    - tests
    - tests-os
    - lint
    - js-tests
    - rust-tests
    - bootstrap-installer
    - e2e-desktop
    - e2e-desktop-core
    - e2e-desktop-update
    - docs-site
    - history-check
    - contributor-check
    - uv-lockfile
    - infographic-check
    - case-collision-check
    - lazy-deps-guard
    - lockfile-diff
    - docker-lint
    - profile-artifact-check
    - icons-freshness-check
    - supply-chain
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs-json: ${{ steps.evaluate.outputs.needs-json }}
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        repository: barakyta-maker/hermes-agent
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Evaluate job results
      id: evaluate
      env:
        NEEDS: ${{ toJSON(needs) }}
        RELEASE: ${{ inputs.release }}
      run: 'args=()

        if [ "$RELEASE" = true ]; then args+=(--release); fi

        printf ''%s'' "$NEEDS" | python3 scripts/ci/required_results.py "${args[@]}"

        '
  ci-timings:
    name: CI timing report
    needs:
    - all-checks-pass
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Restore baseline cache (PR only)
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ci-timings-baseline.json
        key: ci-timings-baseline-never-exact
        restore-keys: 'ci-timings-baseline-

          '
    - name: Collect timings and generate report
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "python3 scripts/ci/timings_report.py \\\n  --baseline ci-timings-baseline.json \\\n  --output ci-timings-report.html\
        \ \\\n  --json-out ci-timings.json \\\n  --summary-out ci-timings-summary.md\n"
    - name: Upload HTML report
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      id: ci-timings-html
      with:
        name: ci-timings-report
        path: ci-timings-report.html
        retention-days: 14
    - name: Build linked review status
      if: hashFiles('ci-timings.json') != ''
      env:
        CI_TIMINGS_REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url }}
      run: "python3 scripts/ci/timings_report.py \\\n  --from-json ci-timings.json \\\n  --baseline ci-timings-baseline.json\
        \ \\\n  --review-status-out review-status.json \\\n  --review-status-only\n"
    - name: Upload review status
      if: hashFiles('review-status.json') != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: review-status-ci-timings
        path: review-status.json
        retention-days: 14
    - name: Output summary
      env:
        REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url}}
      run: "{\n  echo \"# CI Timing report\"\n  echo \"[View the full interactive report]($REPORT_URL)\"\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \ncat ci-timings-summary.md >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Save baseline cache (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: "# Degraded runs (API rate-limited) produce no ci-timings.json —\n# skip rather than fail, and never cache an empty\
        \ baseline.\nif [ -f ci-timings.json ]; then\n  cp ci-timings.json ci-timings-baseline.json\nelse\n  echo \"No timings\
        \ JSON this run — skipping baseline update\"\nfi\n"
    - name: Upload baseline to cache (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('ci-timings-baseline.json') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ci-timings-baseline.json
        key: ci-timings-baseline-${{ github.run_id }}
  routef-source-identity:
    name: Route-F exact-source receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Record source receipt
      shell: bash
      run: 'printf ''%s\n'' ''Route-F independent verification'' ''Source: 01f8332c34107ba5320567fbb64a372657de6082'' ''Tree:
        eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65'' ''Upstream PR: #119064 (acceptance remains separate)'' >> "$GITHUB_STEP_SUMMARY"

        '
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
