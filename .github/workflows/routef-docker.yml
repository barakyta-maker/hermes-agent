# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / Docker Build, Test, and Publish
'on':
  workflow_call:
    inputs:
      release-phase:
        description: 'Stable-release phase: ''test'' or ''publish''. Empty keeps the standalone triggers.'
        required: false
        type: string
        default: ''
      tag:
        description: Exact stable tag (vX.Y.Z) under release. The caller is dispatched on this tag, so '01f8332c34107ba5320567fbb64a372657de6082'
          is the release candidate.
        required: false
        type: string
        default: ''
      version:
        description: Release version written directly to the image install stamp.
        required: false
        type: string
        default: ''
  push:
    branches:
    - routef/independent-ci-01f8332c
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}-${{ inputs.release-phase || 'standalone' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE_NAME: nousresearch/hermes-agent
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
jobs:
  mode:
    name: Resolve release phase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.resolve.outputs.phase }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
    - id: resolve
      env:
        PHASE: ${{ inputs.release-phase }}
      run: "set -euo pipefail\ncase \"$PHASE\" in\n  '')   echo \"phase=standalone\" >> \"$GITHUB_OUTPUT\"; echo \"release=false\"\
        \ >> \"$GITHUB_OUTPUT\" ;;\n  test) echo \"phase=test\"        >> \"$GITHUB_OUTPUT\"; echo \"release=true\"  >> \"\
        $GITHUB_OUTPUT\" ;;\n  publish)\n        echo \"phase=$PHASE\"      >> \"$GITHUB_OUTPUT\"; echo \"release=true\" \
        \ >> \"$GITHUB_OUTPUT\" ;;\n  *)    echo \"::error::Invalid release-phase input: $PHASE\"; exit 1 ;;\nesac\n"
  detect:
    name: Detect affected areas
    needs:
    - mode
    if: needs.mode.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Detect affected areas
      id: classify
      uses: ./.github/actions/detect-changes
      with:
        github-token: ${{ github.token }}
    - name: Decide whether to build
      id: gate
      env:
        DOCKER: ${{ steps.classify.outputs.docker }}
      run: "set -euo pipefail\nif [ \"$DOCKER\" = \"true\" ]; then\n  echo \"build=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo\
        \ \"build=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
  build:
    name: Build and test image (${{ matrix.variant }}/${{ matrix.arch }})
    needs:
    - mode
    - detect
    if: needs.mode.result == 'success' && needs.detect.result == 'success' && github.repository == 'barakyta-maker/hermes-agent'
      && github.ref == 'refs/heads/routef/independent-ci-01f8332c'
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
        - arm64
        variant:
        - slim
        - desktop
        include:
        - arch: amd64
          runner: ubuntu-24.04
          platform: linux/amd64
        - arch: arm64
          runner: ubuntu-24.04-arm
          platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        fetch-depth: 0
        repository: barakyta-maker/hermes-agent
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Write install stamp
      env:
        RELEASE_VERSION: ${{ needs.mode.outputs.release == 'true' && inputs.version || '' }}
      run: "display=\"$RELEASE_VERSION\"\nif [ -z \"$display\" ]; then\n  display=\"$(python3 -m scripts.releases.distance)\"\
        \nfi\nidentity=(--commit \"$HERMES_ROUTEF_SOURCE_SHA\")\nif [ -n \"$display\" ]; then\n  base=\"${display%%+*}\"\n\
        \  development=\"${display#*+}\"\n  if [ \"$development\" = \"$display\" ]; then distance=0; else distance=\"${development%%.*}\"\
        ; fi\n  identity+=(--base-version \"$base\" --display-version \"$display\" --distance \"$distance\")\nfi\npython3\
        \ scripts/write_install_stamp.py --output install-stamp.json \\\n  --distribution docker --update-mechanism external\
        \ --source ci \"${identity[@]}\"\n"
    - name: Reject profile exports in the build context
      run: python3 scripts/ci/check_profile_archive_boundary.py
    - name: Set up Docker Buildx
      id: buildx
      continue-on-error: true
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Set up Docker Buildx (retry)
      if: steps.buildx.outcome == 'failure'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Build image (${{ matrix.variant }}/${{ matrix.arch }})
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
      with:
        context: .
        file: Dockerfile
        load: true
        platforms: ${{ matrix.platform }}
        tags: ${{ env.IMAGE_NAME }}:test
        build-args: 'HERMES_BOT_DESKTOP=${{ matrix.variant == ''desktop'' && ''1'' || ''0'' }}

          '
        cache-from: type=gha,scope=docker-${{ matrix.arch }}
        cache-to: ${{ (github.event_name != 'pull_request' && matrix.variant == 'slim') && format('type=gha,mode=max,scope=docker-{0}',
          matrix.arch) || '' }}
    - name: Park the image install stamp while provisioning the runner toolchain
      run: mv install-stamp.json "$RUNNER_TEMP/install-stamp.json"
    - name: Set up locked Python and test dependencies
      uses: ./.github/actions/setup-pm
      with:
        extras: '[]'
        test-environment: 'true'
        prune-python-cache: true
    - name: Restore the image install stamp for the docker tests
      run: mv "$RUNNER_TEMP/install-stamp.json" install-stamp.json
    - name: Run docker integration tests
      env:
        HERMES_TEST_IMAGE: ${{ env.IMAGE_NAME }}:test
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
      run: '# Each of these tests drives a container, so the docker daemon sets

        # the limit and not the processor. This pins the runner''s worker

        # count to the core count.

        HERMES_TEST_WORKERS=$(nproc) scripts/run_tests.sh tests/docker/

        '
    - name: Verify release image identity
      if: needs.mode.outputs.phase == 'test'
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: "actual=\"$(docker run --rm --entrypoint python \"${IMAGE_NAME}:test\" -c \\\n  'import json; print(json.load(open(\"\
        /opt/hermes/install-stamp.json\"))[\"baseVersion\"])')\"\ntest \"$actual\" = \"$RELEASE_VERSION\"\n"
    - name: Save tested image archive (release test)
      if: needs.mode.outputs.phase == 'test'
      env:
        ARCH: ${{ matrix.arch }}
        RELEASE_TAG: ${{ inputs.tag }}
        VARIANT: ${{ matrix.variant }}
      run: "set -euo pipefail\nmkdir -p /tmp/image-artifacts\ndocker image inspect \"${IMAGE_NAME}:test\" > /tmp/image-artifacts/image-inspect.json\n\
        python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\nimage = json.loads(Path('/tmp/image-artifacts/image-inspect.json').read_text())[0]\n\
        if image['Architecture'] != os.environ['ARCH']:\n    raise SystemExit('Docker image architecture mismatch')\nPath('/tmp/image-artifacts/identity.json').write_text(json.dumps({\n\
        \    'tag': os.environ['RELEASE_TAG'], 'commit': os.environ['GITHUB_SHA'],\n    'arch': os.environ['ARCH'], 'variant':\
        \ os.environ['VARIANT'], 'imageId': image['Id']}), encoding='utf-8')\nPY\ndocker save --output \"/tmp/image-artifacts/image-${ARCH}.tar\"\
        \ \"${IMAGE_NAME}:test\"\n(\n  cd /tmp/image-artifacts\n  sha256sum \"image-${ARCH}.tar\" > \"image-${ARCH}.tar.sha256\"\
        \n)\n"
    - name: Upload tested image archive (release test)
      if: needs.mode.outputs.phase == 'test'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: docker-test-image-${{ matrix.variant }}-${{ matrix.arch }}-${{ inputs.tag }}
        path: '/tmp/image-artifacts/image-${{ matrix.arch }}.tar

          /tmp/image-artifacts/image-${{ matrix.arch }}.tar.sha256

          /tmp/image-artifacts/identity.json

          '
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
  routef-source-identity:
    name: Route-F exact-source receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Record source receipt
      shell: bash
      run: 'printf ''%s\n'' ''Route-F independent verification'' ''Source: 01f8332c34107ba5320567fbb64a372657de6082'' ''Tree:
        eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65'' ''Upstream PR: #119064 (acceptance remains separate)'' >> "$GITHUB_STEP_SUMMARY"

        '
  routef-build-gate:
    name: All four Docker images built and tested
    needs:
    - mode
    - detect
    - build
    - routef-source-identity
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - shell: bash
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: 'python3 - <<''PY''

        import json, os

        results = json.loads(os.environ[''RESULTS''])

        failed = {k:v[''result''] for k,v in results.items() if v[''result''] != ''success''}

        if failed: raise SystemExit(str(failed))

        PY

        '
