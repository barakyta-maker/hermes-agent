# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / JS Tests
'on':
  workflow_call: null
jobs:
  check:
    name: JS & TS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Set up the locked JS build toolchain
      id: node
      uses: ./.github/actions/setup-pm
      with:
        toolchain: all
        extras: '[]'
        test-environment: 'true'
    - name: Install zsh and a virtual display for Electron
      if: runner.os == 'Linux'
      run: "sudo apt-get install -y zsh xvfb \\\n  libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \\\n  xdg-utils libatspi2.0-0\
        \ libdrm2 libgbm1 libasound2t64\n"
    - name: Restore node_modules
      id: node-modules-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: 'node_modules

          apps/*/node_modules

          ui-tui/node_modules

          ui-tui/packages/*/node_modules

          tests-js/node_modules

          web/node_modules

          '
        key: node-modules-scripts-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-npm${{ steps.node.outputs.npm-version
          }}-${{ hashFiles('package-lock.json') }}
    - uses: ./.github/actions/retry
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      with:
        command: npm ci
    - name: Run all workspace checks
      run: node .github/scripts/run-workspace-checks.mjs
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
