# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / Bootstrap installer
'on':
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: bootstrap-installer-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  posix:
    name: install.sh protocol + small fresh-install E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Stage manifest is well-formed protocol v1 (piped, as `curl | bash` runs it)
      shell: bash
      run: "cat scripts/install.sh | bash -s -- --manifest | python3 -c '\nimport json, sys\nm = json.load(sys.stdin)\nassert\
        \ m[\"protocol_version\"] == 1, m\nnames = [s[\"name\"] for s in m[\"stages\"]]\nexpected = [\"prerequisites\", \"\
        repository\", \"venv\", \"python-deps\",\n            \"config\", \"products\", \"setup\", \"gateway\", \"complete\"\
        ]\nassert names == expected, names\nassert m[\"stages\"][-1][\"name\"] == \"complete\"\nprint(\"stage manifest ok:\"\
        , \" -> \".join(names))\n'\n"
    - name: Generated bootstrap pins match pm/lock.json
      shell: bash
      run: python3 scripts/gen-bootstrap-pins.py --check
    - name: Publish the PR checkout as the install source
      id: source
      shell: bash
      run: '# The installer clones --branch <branch>; a PR checkout is a

        # detached HEAD, so mirror it onto a named branch first.

        mirror="$RUNNER_TEMP/source-mirror.git"

        git init --bare "$mirror"

        sha="$(git rev-parse HEAD)"

        git push "$mirror" "HEAD:refs/heads/ci-under-test"

        echo "mirror=$mirror" >> "$GITHUB_OUTPUT"

        echo "sha=$sha" >> "$GITHUB_OUTPUT"

        '
    - name: Check repository/config/completion protocol (not a working install)
      shell: bash
      env:
        HERMES_INSTALL_DIR: ${{ runner.temp }}/bootstrap-install
        HERMES_HOME: ${{ runner.temp }}/hermes-home
        HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-tools
        HERMES_REPO_URL: ${{ steps.source.outputs.mirror }}
      run: "set -euo pipefail\nsha=\"${{ steps.source.outputs.sha }}\"\nrun_stage() {\n  echo \"::group::stage $1\"\n  bash\
        \ scripts/install.sh --branch ci-under-test --commit \"$sha\" \\\n    --non-interactive --stage \"$1\" --json\n  echo\
        \ \"::endgroup::\"\n}\nrun_stage prerequisites\nrun_stage repository\nrun_stage config\nrun_stage complete\ntest -f\
        \ \"$HERMES_INSTALL_DIR/.hermes-bootstrap-complete\"\n"
    - name: Verify the shipped version stamp
      shell: bash
      env:
        HERMES_INSTALL_DIR: ${{ runner.temp }}/bootstrap-install
      run: "python3 scripts/verify-bootstrap-version-stamp.py \\\n  --stamp \"$HERMES_INSTALL_DIR/.hermes-bootstrap-complete\"\
        \ \\\n  --repo \"$HERMES_INSTALL_DIR\" \\\n  --expect-commit \"${{ steps.source.outputs.sha }}\" \\\n  --expect-branch\
        \ ci-under-test \\\n  --no-source-stamp  # the protocol check above skips the products stage\n"
    - name: The pinned commit is on the branch the installer cloned
      shell: bash
      env:
        HERMES_INSTALL_DIR: ${{ runner.temp }}/bootstrap-install
      run: "# The stamp must describe the bytes actually checked out: the\n# installed repo's HEAD is exactly the commit the\
        \ installer pinned.\nhead=\"$(git -C \"$HERMES_INSTALL_DIR\" rev-parse HEAD)\"\ntest \"$head\" = \"${{ steps.source.outputs.sha\
        \ }}\" \\\n  || { echo \"::error::installed HEAD $head != pinned ${{ steps.source.outputs.sha }}\"; exit 1; }\n"
    - name: Prepare tools for the real small-graph installer test
      uses: ./.github/actions/setup-pm
    - name: Prepare isolated acceptance-test dependencies
      shell: bash
      run: python -m scripts.ci.python_packages pytest==9.1.1 pytest-asyncio==1.3.0 ruamel.yaml==0.18.17 packaging==26.0
    - name: Current installer to PM worker to published command
      shell: bash
      env:
        HERMES_TEST_FILE_RETRIES: '0'
      run: bash scripts/run_tests.sh tests/scripts/test_fresh_source_install.py -q -j 1
  windows:
    name: install.ps1 protocol surface
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Protocol version + stage manifest (Windows PowerShell 5.1)
      shell: powershell
      run: '$pv = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -ProtocolVersion

        if ("$pv" -ne "1") { Write-Error "protocol version ''$pv'' != 1"; exit 1 }

        $json = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Manifest | ConvertFrom-Json

        if ($json.protocol_version -ne 1) { Write-Error "manifest protocol_version != 1"; exit 1 }

        $names = @($json.stages | ForEach-Object { $_.name })

        if ($names -notcontains "complete") { Write-Error "manifest missing complete stage"; exit 1 }

        Write-Host "stage manifest ok: $($names -join '' -> '')"

        '
    - name: Protocol version + stage manifest (pwsh 7)
      shell: pwsh
      run: '$pv = pwsh -NoProfile -File scripts/install.ps1 -ProtocolVersion

        if ("$pv" -ne "1") { Write-Error "protocol version ''$pv'' != 1"; exit 1 }

        $json = pwsh -NoProfile -File scripts/install.ps1 -Manifest | ConvertFrom-Json

        if ($json.protocol_version -ne 1) { Write-Error "manifest protocol_version != 1"; exit 1 }

        Write-Host "stage manifest ok (pwsh 7)"

        '
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
