# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / Tests
'on':
  workflow_call:
    inputs:
      e2e:
        description: Run the e2e job (tests/e2e except the upgrade suite).
        type: boolean
        required: false
        default: true
      e2e_upgrade:
        description: Run the e2e-upgrade shards (tests/e2e/core/upgrade).
        type: boolean
        required: false
        default: true
      strict_acceptance:
        description: 'Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing (''upd-txn'',
          a comma list, or ''1'' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  test:
    name: Run tests (${{ matrix.slice }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slice:
        - 1
        - 2
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Install ripgrep (prebuilt binary)
      run: "set -euo pipefail\nRG_VERSION=15.1.0\nRG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599\n\
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz\ncurl -sSfL --retry 3 --retry-delay 5 -o \"$RG_TARBALL\"\
        \ \\\n  \"https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}\"\necho \"${RG_SHA256}\
        \  ${RG_TARBALL}\" | sha256sum -c -\ntar -xzf \"$RG_TARBALL\"\nsudo mv \"ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg\"\
        \ /usr/local/bin/rg\nrm -rf \"$RG_TARBALL\" \"ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl\"\nrg --version\n"
    - name: Set up locked Python and test dependencies
      uses: ./.github/actions/setup-pm
      with:
        extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
        test-environment: 'true'
        prune-python-cache: true
    - name: Check SQLite runs WAL
      run: '"$HERMES_PYTHON" -c "import sqlite3, sys, hermes_state_wal as w; v = w.is_sqlite_wal_reset_vulnerable(); print(f''Python
        {sys.version.split()[0]}, SQLite {sqlite3.sqlite_version}, WAL-reset vulnerable: {v}''); sys.exit(1 if v else 0)"

        '
    - name: Restore per-file duration cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: test_durations.json
        key: test-durations-never-exact
        restore-keys: 'test-durations-

          '
    - name: Run tests
      run: 'scripts/run_tests.sh

        '
      env:
        HERMES_TEST_SLICE: ${{ matrix.slice }}/2
        HERMES_TEST_FILE_TIMEOUT: 600
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
    - name: Save per-file duration cache (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test_durations.json') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: test_durations.json
        key: test-durations-${{ github.run_id }}-${{ matrix.slice }}
  e2e:
    if: inputs.e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Set up locked Python, Node and test dependencies
      uses: ./.github/actions/setup-pm
      with:
        toolchain: all
        extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "messaging"]'
        test-environment: 'true'
        prune-python-cache: true
    - name: Install Node deps and build the Ink TUI
      uses: ./.github/actions/retry
      with:
        command: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui
    - name: Install ripgrep (prebuilt binary)
      run: "set -euo pipefail\nRG_VERSION=15.1.0\nRG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599\n\
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz\ncurl -sSfL --retry 3 --retry-delay 5 -o \"$RG_TARBALL\"\
        \ \\\n  \"https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}\"\necho \"${RG_SHA256}\
        \  ${RG_TARBALL}\" | sha256sum -c -\ntar -xzf \"$RG_TARBALL\"\nsudo mv \"ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg\"\
        \ /usr/local/bin/rg\nrm -rf \"$RG_TARBALL\" \"ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl\"\nrg --version\n"
    - name: Require a WAL-capable SQLite
      run: '"$HERMES_PYTHON" -c "import sqlite3, hermes_state_wal as w; print(''sqlite'', sqlite3.sqlite_version); assert
        not w.is_sqlite_wal_reset_vulnerable()"

        '
    - name: Run e2e tests
      run: 'mapfile -t files < <(find tests/e2e -name ''test_*.py'' -not -path ''tests/e2e/core/upgrade/*'' | sort)

        scripts/run_tests.sh --include-integration "${files[@]}"

        '
      env:
        HERMES_E2E_STRICT_ACCEPTANCE: ${{ inputs.strict_acceptance }}
        HERMES_TEST_FILE_TIMEOUT: '900'
        HERMES_TEST_FILE_RETRIES: '0'
        HERMES_E2E_REQUIRE_TUI: '1'
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
  e2e-upgrade-plan:
    if: inputs.e2e_upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        sparse-checkout: tests/e2e/core/upgrade
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: List suite directories
      id: plan
      run: "set -euo pipefail\nshards=$(python3 - <<'PY'\nimport json, pathlib\nroot = pathlib.Path(\"tests/e2e/core/upgrade\"\
        )\nshards = [\"core\"] if any(root.glob(\"test_*.py\")) else []\nshards += sorted(d.name for d in root.iterdir()\n\
        \                 if d.is_dir() and not d.name.startswith((\"_\", \".\")) and any(d.rglob(\"test_*.py\")))\nprint(json.dumps(shards))\n\
        PY\n)\necho \"shards=$shards\" | tee -a \"$GITHUB_OUTPUT\"\n"
  e2e-upgrade:
    name: e2e-upgrade (${{ matrix.shard }})
    needs: e2e-upgrade-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-upgrade-plan.outputs.shards) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
        fetch-tags: true
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 26
    - name: Install ripgrep (prebuilt binary)
      run: "set -euo pipefail\nRG_VERSION=15.1.0\nRG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599\n\
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz\ncurl -sSfL --retry 3 --retry-delay 5 -o \"$RG_TARBALL\"\
        \ \\\n  \"https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}\"\necho \"${RG_SHA256}\
        \  ${RG_TARBALL}\" | sha256sum -c -\ntar -xzf \"$RG_TARBALL\"\nsudo mv \"ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg\"\
        \ /usr/local/bin/rg\nrm -rf \"$RG_TARBALL\" \"ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl\"\nrg --version\n"
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.12.13
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python 3.14
      run: uv python install 3.14
    - name: Install dependencies
      uses: ./.github/actions/retry
      with:
        command: uv sync --locked --python 3.14 --extra all --group dev --extra anthropic --extra mistral --extra fal --extra
          modal --extra daytona --extra parallel-web
    - name: Install bubblewrap
      run: 'sudo apt-get update -qq

        sudo apt-get install -y -qq bubblewrap

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

        # The suite''s own probe (_bwrap_usable, same flags as every sandboxed

        # run): without it the suite silently runs the updater unsandboxed.

        source .venv/bin/activate

        python -c "from tests.e2e.core.upgrade._helpers import BWRAP_OK; assert BWRAP_OK, ''bwrap unusable''" && echo "bwrap
        ok"

        '
    - name: Require a WAL-capable SQLite
      run: 'source .venv/bin/activate

        python -c "import sqlite3, hermes_state_wal as w; print(''sqlite'', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

        '
    - name: Run upgrade e2e tests (${{ matrix.shard }})
      run: "set -euo pipefail\nsource .venv/bin/activate\nif [ \"$SHARD\" = core ]; then\n  mapfile -t files < <(find tests/e2e/core/upgrade\
        \ -maxdepth 1 -name 'test_*.py' | sort)\nelse\n  mapfile -t files < <(find \"tests/e2e/core/upgrade/$SHARD\" -name\
        \ 'test_*.py' | sort)\nfi\n# A shard that collects nothing is a wiring bug, not a pass.\n[ \"${#files[@]}\" -gt 0\
        \ ] || { echo \"no test files for shard $SHARD\" >&2; exit 1; }\nprintf 'shard %s: %s\\n' \"$SHARD\" \"${files[*]}\"\
        \nscripts/run_tests.sh --include-integration \"${files[@]}\"\n"
      env:
        SHARD: ${{ matrix.shard }}
        HERMES_E2E_STRICT_ACCEPTANCE: ${{ inputs.strict_acceptance }}
        HERMES_TEST_FILE_TIMEOUT: '3000'
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
