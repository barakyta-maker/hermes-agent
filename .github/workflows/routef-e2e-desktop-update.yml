# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / E2E Desktop update
'on':
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: e2e-desktop-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    name: Desktop install/update E2E (Linux, ${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - cell: first-run
          specs: e2e/update/first-run.spec.ts e2e/update/gates.spec.ts
        - cell: app-update
          specs: e2e/update/app-update.spec.ts
        - cell: build-fail
          specs: e2e/update/build-fail.spec.ts
        - cell: update-concurrency
          specs: e2e/update/update-concurrency.spec.ts
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Install system dependencies for Electron and the sandbox
      run: "sudo apt-get update -qq\nsudo apt-get install -y -qq \\\n  xvfb bubblewrap \\\n  libgtk-3-0 libnotify4 libnss3\
        \ libxss1 libxtst6 \\\n  xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64\n# bwrap (the installer/updater sandbox)\
        \ needs unprivileged user namespaces.\nsudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true\n"
    - name: Prepare locked toolchain and test environment
      id: pm
      uses: ./.github/actions/setup-pm
      with:
        toolchain: all
        extras: '[]'
        test-environment: 'true'
    - uses: ./.github/actions/retry
      with:
        command: npm ci
    - name: Run the update suite under xvfb
      working-directory: apps/desktop
      run: "git --version\n# Resource trail in the log, so a runner that dies mid-run leaves its last state behind.\n( while\
        \ sleep 10; do\n    echo \"::group::resources $(date -u +%T)\"\n    df -h / \"$RUNNER_TEMP\" | tail -n +2; free -g\
        \ | head -2\n    echo \"procs=$(ps -e --no-headers | wc -l) upload-packs=$(pgrep -c -f git-upload-pack || true)\"\n\
        \    ps -eo pid,ppid,etimes,rss,args --sort=-rss | head -6 | cut -c1-200\n    ps -eo args | grep -E '(^|/)git[ -]'\
        \ | cut -c1-160 | sort | uniq -c | sort -rn | head -8\n    # Ancestry of the newest upload-pack: who is asking for\
        \ all these packs?\n    p=$(pgrep -n -f git-upload-pack || true)\n    while [ -n \"$p\" ] && [ \"$p\" != 1 ]; do\n\
        \      ps -o pid=,etimes=,args= -p \"$p\" | cut -c1-220; p=$(ps -o ppid= -p \"$p\" | tr -d ' ')\n    done\n    echo\
        \ \"::endgroup::\"\n  done ) &\nxvfb-run -a --server-args=\"-screen 0 1280x1024x24\" \\\n  npx playwright test -c\
        \ e2e/update/playwright.config.ts ${{ matrix.specs }}\n"
      env:
        CI: 'true'
        HERMES_E2E_PYTHON: ${{ steps.pm.outputs.python-path }}
        HERMES_E2E_UPDATE_ROOT: ${{ runner.temp }}/hdu
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
        ANTHROPIC_API_KEY: ''
    - name: Collect the install's logs
      if: failure() || cancelled()
      run: 'mkdir -p apps/desktop/test-results/update/install-logs

        cp -r "${{ runner.temp }}/hdu/sb/home/.hermes/logs" apps/desktop/test-results/update/install-logs/ 2>/dev/null ||
        true

        cp "${{ runner.temp }}/hdu/sb/terminal-update.log" apps/desktop/test-results/update/install-logs/ 2>/dev/null || true

        '
    - name: Upload failure artifacts
      if: failure() || cancelled()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: desktop-update-e2e-${{ matrix.cell }}-${{ '01f8332c34107ba5320567fbb64a372657de6082' }}
        path: 'apps/desktop/test-results/update

          apps/desktop/playwright-report/update

          '
        retention-days: 14
        overwrite: true
        if-no-files-found: ignore
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
