# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / History Check
'on':
  workflow_call:
    outputs:
      review_status:
        description: JSON array of review_status objects for the synthesizer.
        value: ${{ jobs.check-common-ancestor.outputs.review_status }}
permissions:
  contents: read
jobs:
  check-common-ancestor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      review_status: ${{ steps.merge-base-check.outputs.review_status }}
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - id: merge-base-check
      name: Reject PRs with no common ancestor on main
      run: "# `git merge-base` exits non-zero AND prints nothing when the two\n# commits share no ancestor.  We check both\
        \ conditions explicitly\n# so the failure message is clear regardless of which signal fires\n# first.\nif ! BASE=$(git\
        \ merge-base origin/main HEAD 2>/dev/null) || [ -z \"$BASE\" ]; then\n  STATUS='[{\"source\":\"unrelated histories\"\
        ,\"results\":[{\"kind\":\"action_required\",\"title\":\"Unrelated histories\",\"summary\":\"This PR has no common\
        \ ancestor with main.\",\"detail\":\"\",\"how_to_fix\":\"Rebase your changes onto current main:\\n```\\ngit fetch\
        \ origin main\\ngit checkout -b fix-branch origin/main\\n# re-apply your changes (cherry-pick, copy files, etc.)\\\
        ngit push -f origin fix-branch\\n```\\n\"}]}]'\n  echo \"review_status=${STATUS}\" >> \"$GITHUB_OUTPUT\"\n  echo \"\
        review_status=${STATUS}\" > review-status.json\n  echo \"\"\n  echo \"::error::This PR has no common ancestor with\
        \ main.\"\n  echo \"\"\n  echo \"Your branch's history is disconnected from main.  Common causes:\"\n  echo \"  -\
        \ the branch was created with 'git checkout --orphan'\"\n  echo \"  - '.git/' was re-initialized at some point during\
        \ the work\"\n  echo \"  - the branch was force-pushed from an unrelated repository\"\n  echo \"\"\n  echo \"Merging\
        \ an unrelated-history PR grafts a parent-less root commit\"\n  echo \"into main and collapses git blame for every\
        \ file in that snapshot.\"\n  echo \"Reference: PR #25045 caused this and re-rooted blame on ~1500\"\n  echo \"files\
        \ to a single orphan commit.\"\n  echo \"\"\n  echo \"To fix, rebase your changes onto current main:\"\n  echo \"\
        \  git fetch origin main\"\n  echo \"  git checkout -b fix-branch origin/main\"\n  echo \"  # re-apply your changes\
        \ (cherry-pick, copy files, etc.)\"\n  echo \"  git push -f origin fix-branch\"\n  exit 1\nfi\necho \"::notice::Common\
        \ ancestor with main: $BASE\"\necho \"review_status=[]\" >> \"$GITHUB_OUTPUT\"\necho \"review_status=[]\" > review-status.json\n"
    - name: Upload review status artifact
      if: always() && steps.merge-base-check.outcome != 'skipped'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: review-status-history-check
        path: review-status.json
        retention-days: 1
        overwrite: true
        if-no-files-found: ignore
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
