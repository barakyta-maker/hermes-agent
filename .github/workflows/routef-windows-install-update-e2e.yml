# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / Windows install + update E2E
'on':
  workflow_call:
    inputs:
      strict_acceptance:
        description: 'Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing (''upd-txn'',
          a comma list, or ''1'' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      strict_acceptance:
        description: 'Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing (''upd-txn'',
          a comma list, or ''1'' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).'
        type: string
        required: false
        default: ''
  push:
    branches:
    - wine2e-install/**
permissions:
  contents: read
concurrency:
  group: windows-install-update-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install-update:
    name: Windows install.ps1 + hermes update E2E
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Set up locked Python and test dependencies
      uses: ./.github/actions/setup-pm
      with:
        packages: git,ripgrep
        extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
        test-environment: 'true'
        prune-python-cache: true
    - name: Run Windows install + update E2E
      shell: bash
      run: "scripts/run_tests.sh tests/e2e/core/windows_update/ -- \\\n  -m \"platforms and integration\" -v --tb=short -rA\n"
      env:
        HERMES_E2E_WINDOWS_INSTALL: '1'
        HERMES_E2E_STRICT_ACCEPTANCE: ${{ inputs.strict_acceptance }}
        HERMES_E2E_MACHINE_ROOT: ${{ runner.temp }}\wm
        HERMES_E2E_PROFILES_ROOT: C:\Users
        HERMES_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
        HERMES_TEST_WORKERS: '6'
        HERMES_TEST_FILE_TIMEOUT: '3600'
        HERMES_TEST_FILE_RETRIES: '0'
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
    - name: Every crash cell ran
      shell: pwsh
      env:
        HERMES_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
      run: "$manifest = Join-Path $env:HERMES_E2E_ARTIFACTS 'crash-cells-ran.txt'\nif (-not (Test-Path -LiteralPath $manifest))\
        \ {\n  throw \"test_crash_cells.py ran no crash cells: $manifest is missing\"\n}\nGet-Content -LiteralPath $manifest\n"
    - name: Upload transcripts, logs and receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-install-update-e2e-${{ github.run_attempt }}
        path: ${{ runner.temp }}/win-update-e2e
        if-no-files-found: ignore
        retention-days: 14
    - name: No leftover Python / Hermes processes
      if: always()
      shell: pwsh
      run: "$names = 'python.exe', 'pythonw.exe', 'hermes.exe', 'node.exe'\n# Work dirs live under runner.temp\\wm; profiles\
        \ are C:\\Users\\*hermes-e2e-<id>.\n$root = \"${{ runner.temp }}\\wm\".ToLower()\n$profileMark = 'hermes-e2e-'\n$deadline\
        \ = (Get-Date).AddSeconds(20)\ndo {\n  $left = @(Get-CimInstance Win32_Process | Where-Object {\n    $blob = \"$($_.CommandLine)\
        \ $($_.ExecutablePath)\".ToLower()\n    ($names -contains $_.Name.ToLower()) -and ($blob.Contains($root) -or $blob.Contains($profileMark))\n\
        \  })\n  if ($left.Count -eq 0) { 'no leftover processes from the E2E machines'; exit 0 }\n  Start-Sleep -Milliseconds\
        \ 500\n} while ((Get-Date) -lt $deadline)\nforeach ($p in $left) {\n  \"::error::leftover pid=$($p.ProcessId) ppid=$($p.ParentProcessId):\
        \ $($p.CommandLine)\"\n}\nexit 1\n"
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
