# Independent Route-F CI adapter. Original source/workflows stay unchanged.
name: Route-F independent / Docs Site Checks
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  docs-site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: barakyta-maker/hermes-agent
        ref: 01f8332c34107ba5320567fbb64a372657de6082
        persist-credentials: false
    - name: Verify exact Route-F source identity
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = ''01f8332c34107ba5320567fbb64a372657de6082''

        test "$(git rev-parse HEAD^{tree})" = ''eaaf4cd4bcbc38bee94a30a83cfaab58e504ea65''

        '
    - name: Set up the locked site toolchain
      uses: ./.github/actions/setup-pm
      with:
        toolchain: all
        node-cache-dependency-path: website/package-lock.json
    - name: Install website dependencies
      uses: ./.github/actions/retry
      with:
        command: npm ci
        working-directory: website
    - name: Install ascii-guard
      uses: ./.github/actions/retry
      with:
        command: python -m scripts.ci.python_packages ascii-guard==2.3.0 ruamel.yaml==0.18.17
    - name: Extract skill metadata for dashboard
      run: python3 website/scripts/extract-skills.py
    - name: Regenerate per-skill docs pages + catalogs
      run: python3 website/scripts/generate-skill-docs.py
    - name: Committed skill docs match the generator
      run: "git add -N website/docs website/sidebars.ts\nif ! git diff --exit-code --stat -- website/docs website/sidebars.ts\
        \ website/i18n; then\n  echo \"::error::website/scripts/generate-skill-docs.py output differs from the committed docs;\
        \ run it and commit the result\"\n  exit 1\nfi\n"
    - name: Check cross-page links resolve on GitHub and on the site
      run: python3 website/scripts/check_doc_links.py
    - name: Lint docs diagrams
      run: npm run lint:diagrams
      working-directory: website
    - name: Build Docusaurus
      run: npm run build:fast
      working-directory: website
env:
  HERMES_ROUTEF_SOURCE_SHA: 01f8332c34107ba5320567fbb64a372657de6082
